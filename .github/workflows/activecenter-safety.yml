name: Activecenter Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  safety:
    name: safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contract and behavior tests
        run: pnpm test

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Verify
        run: pnpm run verify

      - name: Resume smoke
        run: pnpm run smoke:resume

      - name: Read-only production smoke
        run: pnpm run smoke:readonly
        env:
          # Seit 24.08.2026 (init-quiz-db-Entfernung deployt): entfernte Route
          # muss in Produktion strikt 404 liefern (Audit-Abnahmekriterium 13.4).
          READONLY_SMOKE_STRICT_INIT_ROUTE: '1'
