name: Activecenter Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  safety:
    name: safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contract and behavior tests
        run: pnpm test

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Verify
        run: pnpm run verify

      - name: Resume smoke
        # P0-4: generate_resume_token laeuft im Auth-Beobachtungsmodus. Der Service-Key wird
        # seit der Rotation vom 24.08.2026 bereits mitgeschickt, damit der Smoke am Tag des
        # Enforcements (BRIDGE_SERVICE_AUTH_ENFORCE=1) nicht als Erster mit 401
        # service_auth_required umfaellt. Solange die Produktion den rotierten Key noch nicht
        # ausgerollt hat, meldet die Bridge lediglich auth_state 'invalid' und bleibt gruen.
        # Fehlt das Secret (z.B. in einem Fork), geht der Header gar nicht erst mit - das ist
        # exakt der bisherige Zustand.
        run: pnpm run smoke:resume
        env:
          BRIDGE_SERVICE_KEY: ${{ secrets.BRIDGE_SERVICE_KEY }}

      - name: Read-only production smoke
        run: pnpm run smoke:readonly
        env:
          # Seit 24.08.2026 (init-quiz-db-Entfernung deployt): entfernte Route
          # muss in Produktion strikt 404 liefern (Audit-Abnahmekriterium 13.4).
          READONLY_SMOKE_STRICT_INIT_ROUTE: '1'

  e2e-queue:
    # Fehlerfall-E2E (Audit P0-6): der frisch gebaute Client laeuft im echten Browser
    # gegen die Produktions-API (markierte Testleads) und muss Totalausfall, Reload-
    # Nachlieferung und transiente 500er ohne Eventverlust ueberstehen.
    name: e2e-queue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Queue failure suite
        run: pnpm run e2e:queue

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: e2e-artifacts/
          retention-days: 7

  deploy:
    # Deploy-Pipeline Stufe 1 (Audit 13.3.3: CI-Gates VOR dem Deploy). Ersetzt den rohen
    # Git-Webhook, der bewusst aus ist: Deployt wird NUR nach gruenen Pflicht-Checks, NUR
    # auf main, NUR wenn Runtime-Dateien betroffen sind - und der Erfolg wird ueber
    # /health/live bewiesen statt angenommen. Stufe 2 (13.5.6, Digest-Promotion statt
    # Neubau aus demselben Commit) folgt mit der Hetzner-Zielpipeline.
    name: deploy
    needs: [safety, e2e-queue]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Runtime-Aenderung erkennen
        id: runtime
        run: |
          VORHER="${{ github.event.before }}"
          if ! git cat-file -e "$VORHER" 2>/dev/null; then
            VORHER="${{ github.sha }}~1"
          fi
          GEAENDERT=$(git diff --name-only "$VORHER" "${{ github.sha }}")
          echo "$GEAENDERT"
          if echo "$GEAENDERT" | grep -qE '^(api/|server/|src/|fonts/|Dockerfile|index\.html|berater-info\.html|translations\.js|video-config\.js|ac-track\.js|build\.js|package\.json|pnpm-lock\.yaml)'; then
            echo "deploy=ja" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=nein" >> "$GITHUB_OUTPUT"
            echo "Nur docs/scripts geaendert - kein Deploy noetig."
          fi

      - name: Coolify-Deploy anstossen
        if: steps.runtime.outputs.deploy == 'ja'
        run: |
          ANTWORT=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            "https://coolify.hl-support.biz/api/v1/deploy?uuid=yhoacszoiofuq6dg4mykyr7b")
          echo "$ANTWORT"

      - name: Deploy ueber /health/live beweisen
        if: steps.runtime.outputs.deploy == 'ja'
        run: |
          for i in $(seq 1 40); do
            COMMIT=$(curl -fsS -m 10 https://quiz.activecenter.info/health/live | grep -o '"commit":"[a-f0-9]*"' | cut -d'"' -f4 || true)
            echo "Versuch $i: live=$COMMIT erwartet=${{ github.sha }}"
            if [ "$COMMIT" = "${{ github.sha }}" ]; then
              echo "Produktion traegt den gemergten Commit."
              exit 0
            fi
            sleep 15
          done
          echo "Produktion hat den Commit nach 10 Minuten NICHT uebernommen." >&2
          exit 1
