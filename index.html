<body style="margin: 0; padding: 0;">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', system-ui, sans-serif; }
        p { margin: 0; }
        .app-loader {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px 16px;
          background:
            radial-gradient(ellipse at 20% 15%, rgba(201,168,76,0.07) 0%, transparent 44%),
            radial-gradient(ellipse at 80% 85%, rgba(74,100,200,0.07) 0%, transparent 44%),
            #070B14;
          color: #F5F0E8;
          font-family: 'DM Sans', system-ui, sans-serif;
        }
        .app-loader__panel {
          width: 100%;
          max-width: 420px;
          padding: 42px 28px;
          text-align: center;
          border: 1px solid rgba(201,168,76,0.14);
          border-radius: 24px;
          background: rgba(255,255,255,0.03);
          box-shadow: 0 24px 70px rgba(0,0,0,0.28);
          backdrop-filter: blur(20px);
        }
        .app-loader__logo {
          display: block;
          width: 168px;
          max-width: 70%;
          height: auto;
          margin: 0 auto 30px;
        }
        .app-loader__badge {
          margin-bottom: 14px;
          color: #C9A84C;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 3.2px;
          text-transform: uppercase;
        }
        .app-loader__title {
          margin-bottom: 10px;
          color: #F5F0E8;
          font-family: Georgia, 'Times New Roman', serif;
          font-size: clamp(30px, 7vw, 42px);
          font-weight: 600;
          line-height: 1.1;
        }
        .app-loader__text {
          color: rgba(245,240,232,0.58);
          font-size: 15px;
          line-height: 1.6;
        }
        .app-loader__bar {
          width: 160px;
          height: 3px;
          margin: 30px auto 0;
          overflow: hidden;
          border-radius: 999px;
          background: rgba(201,168,76,0.12);
        }
        .app-loader__bar span {
          display: block;
          width: 42%;
          height: 100%;
          border-radius: inherit;
          background: linear-gradient(90deg, transparent, #C9A84C, transparent);
          animation: appLoaderSlide 1.15s ease-in-out infinite;
        }
        @keyframes appLoaderSlide {
          0% { transform: translateX(-120%); }
          100% { transform: translateX(260%); }
        }
        #legalModal.hidden { display: none !important; }
        #legalModal.opacity-0 { opacity: 0 !important; }
        #legalModalContent.scale-95 { transform: scale(0.95) !important; }
    </style>

    <script>
      function getOrganisationName() {
        try {
          const coach = JSON.parse(localStorage.getItem('acCoach') || 'null');
          const orgName = String((coach && coach.organisation_name) || '').trim();
          return orgName || 'Activecenter';
        } catch (_) {
          return 'Activecenter';
        }
      }

      document.title = document.title
        .replace(/ActiveCenter/g, getOrganisationName())
        .replace(/Activecenter/g, getOrganisationName());

      function showResumeLoaderIfNeeded() {
        var params = new URLSearchParams(window.location.search || '');
        if (!params.get('r') && !params.get('resume')) return;

        var root = document.getElementById('root');
        if (!root) return;

        root.innerHTML = [
          '<div class="app-loader" aria-live="polite" aria-busy="true">',
            '<div class="app-loader__panel">',
              '<img class="app-loader__logo" src="https://hl-support.biz/storage/images/cwemaillogo-1bcb4f.png" alt="Activecenter">',
              '<div class="app-loader__badge">Activecenter</div>',
              '<div class="app-loader__title">Dein Zugang wird geladen</div>',
              '<div class="app-loader__text">Wir bereiten deine Videos vor.</div>',
              '<div class="app-loader__bar" aria-hidden="true"><span></span></div>',
            '</div>',
          '</div>'
        ].join('');
      }

      showResumeLoaderIfNeeded();
      // ── i18n Sprachenverwaltung ────────────────────────────────────
      function getCurrentSlugForLanguage() {
        var slug = (window.location.pathname || '').replace(/^\/+/, '').toLowerCase().split('/')[0] || 'default';
        return /^[a-z0-9_-]{1,25}$/.test(slug) ? slug : 'default';
      }

      var currentLang = (function() {
        var stored = localStorage.getItem('preferredLang:' + getCurrentSlugForLanguage());
        if (stored && ['de','it','fr','ru','en','hu'].includes(stored)) return stored;
        var browser = (navigator.language || 'de').split('-')[0].toLowerCase();
        return ['it','fr','ru','en','hu'].includes(browser) ? browser : 'de';
      })();

      function setLang(lang) {
        if (['de','it','fr','ru','en','hu'].includes(lang)) {
          localStorage.setItem('preferredLang:' + getCurrentSlugForLanguage(), lang);
          window.location.reload();
        }
      }

      function updateLanguageSwitcher() {
        var langDE = document.getElementById('langDE');
        var langIT = document.getElementById('langIT');
        var langFR = document.getElementById('langFR');
        var langRU = document.getElementById('langRU');
        var langEN = document.getElementById('langEN');
        var langHU = document.getElementById('langHU');

        [langDE, langIT, langFR, langRU, langEN, langHU].forEach(function(el) {
          if (el) el.classList.remove('active');
        });

        if (currentLang === 'de' && langDE) langDE.classList.add('active');
        if (currentLang === 'it' && langIT) langIT.classList.add('active');
        if (currentLang === 'fr' && langFR) langFR.classList.add('active');
        if (currentLang === 'ru' && langRU) langRU.classList.add('active');
        if (currentLang === 'en' && langEN) langEN.classList.add('active');
        if (currentLang === 'hu' && langHU) langHU.classList.add('active');
      }

      updateLanguageSwitcher();
      document.addEventListener('DOMContentLoaded', updateLanguageSwitcher);

        function loadAppModule() {
            if (!window.TRANSLATIONS || Object.keys(window.TRANSLATIONS).length === 0) {
                setTimeout(loadAppModule, 50);
                return;
            }
            const script = document.createElement('script');
            script.type = 'module';
            script.src = '/assets/app.js';
            document.body.appendChild(script);
        }
        loadAppModule();
    </script>
